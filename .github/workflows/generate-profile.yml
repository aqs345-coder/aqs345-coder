name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *" # Executa a cada 12 horas (atende a ambos os scripts)
  workflow_dispatch: # Permite execução manual
  push:
    branches:
      - main
    paths:
      - "config.yml"
      - "generator/**"

jobs:
  # -------------------------------------------------------------
  # JOB 1: O seu gerador original (Python)
  # -------------------------------------------------------------
  generate_profile_svgs:
    name: Generate galaxy profile assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m generator.main

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/generated/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update profile SVGs [skip ci]"
            git push
          fi

  # -------------------------------------------------------------
  # JOB 2: O novo gerador do Pac-Man
  # -------------------------------------------------------------
  generate_pacman:
    name: Generate Pac-Man Graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
